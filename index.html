<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>✨lorraineee homepage✨</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: linear-gradient(135deg, #ffe6f2, #e6f7ff);
      font-family: 'Comic Sans MS', cursive, sans-serif;
      color: #5a5a5a;
      min-height: 100vh;
    }

    .navbar {
      background-color: white;
      box-shadow: 0 4px 12px rgba(255, 150, 200, 0.2);
      padding: 15px 0;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 1000;
    }

    .nav-container {
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 20px;
    }

    .logo {
      color: #ff69b4;
      font-size: 1.5em;
      font-weight: bold;
      text-decoration: none;
    }

    .nav-links {
      display: flex;
      gap: 30px;
    }

    .nav-links a {
      color: #5a5a5a;
      text-decoration: none;
      font-weight: bold;
      padding: 8px 16px;
      border-radius: 20px;
      transition: all 0.3s ease;
    }

    .nav-links a:hover {
      background-color: #fff0f5;
      color: #ff69b4;
      transform: translateY(-2px);
    }

    .card {
      background-color: white;
      border-radius: 24px;
      padding: 30px;
      box-shadow: 0 10px 30px rgba(255, 150, 200, 0.3);
      max-width: 90%;
      width: 500px;
      margin: 120px auto 50px;
      animation: float 3s ease-in-out infinite;
      text-align: center;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }

    h1 {
      color: #ff69b4;
      font-size: 2.5em;
      margin-bottom: 10px;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
    }

    .emoji {
      font-size: 2em;
      margin: 10px 0;
      display: block;
    }

    p {
      font-size: 1.1em;
      line-height: 1.6;
    }

    .highlight {
      background-color: #fff0f5;
      padding: 4px 8px;
      border-radius: 10px;
      color: #ff1493;
      font-weight: bold;
    }

    .footer {
      margin-top: 20px;
      font-size: 0.9em;
      color: #aaa;
    }

    a {
      color: #ff69b4;
      text-decoration: none;
      font-weight: bold;
    }

    a:hover {
      text-decoration: underline;
    }

    .heart {
      color: #ff4d94;
      animation: pulse 1.2s infinite;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.2); }
    }

    .content-page {
      max-width: 1200px;
      margin: 120px auto 50px;
      padding: 0 20px;
    }

    .content-card {
      background-color: white;
      border-radius: 24px;
      padding: 40px;
      box-shadow: 0 10px 30px rgba(255, 150, 200, 0.3);
    }

    .content-card h2 {
      color: #ff69b4;
      font-size: 2em;
      margin-bottom: 30px;
      text-align: center;
    }

    .content-number {
      font-size: 10em;
      font-weight: bold;
      color: #ff69b4;
      text-align: center;
      margin: 50px 0;
      text-shadow: 4px 4px 8px rgba(255, 150, 200, 0.3);
    }
  </style>
</head>
<body>
  <nav class="navbar">
    <div class="nav-container">
      <a href="index.html" class="logo">✨lrj的小天地✨</a>
      <div class="nav-links">
        <a href="education.html">教育背景</a>
        <a href="internship.html">实习经历</a>
        <a href="projects.html">项目经历</a>
      </div>
    </div>
  </nav>

  <div class="card">
    <h1>你好呀！👋</h1>
    <div class="emoji">🎀💖🌈</div>
    <p>
      我是 <span class="highlight">lorraine</span>，一个爱生活、爱探索的小天才:3
    </p>
    <p>
      欢迎来了解一部分的我！✨  
      你可以<a href="mailto:lorraine-lrj1016@sjtu.edu.cn">给我发邮件</a>，或者在社交平台找我玩！
    </p>
    <div class="footer">
      🌸 制作于 2026 春 （持续更新中）✨
    </div>
  </div>
</body>
</html>
