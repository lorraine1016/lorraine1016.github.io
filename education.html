<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>教育背景 | ✨lrj的小天地✨</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: linear-gradient(135deg, #ffe6f2, #e6f7ff);
      font-family: 'Comic Sans MS', cursive, sans-serif;
      color: #5a5a5a;
      min-height: 100vh;
    }

    .navbar {
      background-color: white;
      box-shadow: 0 4px 12px rgba(255, 150, 200, 0.2);
      padding: 15px 0;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 1000;
    }

    .nav-container {
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 20px;
    }

    .logo {
      color: #ff69b4;
      font-size: 1.5em;
      font-weight: bold;
      text-decoration: none;
    }

    .nav-links {
      display: flex;
      gap: 30px;
    }

    .nav-links a {
      color: #5a5a5a;
      text-decoration: none;
      font-weight: bold;
      padding: 8px 16px;
      border-radius: 20px;
      transition: all 0.3s ease;
    }

    .nav-links a:hover {
      background-color: #fff0f5;
      color: #ff69b4;
      transform: translateY(-2px);
    }

    .content-page {
      max-width: 1200px;
      margin: 120px auto 50px;
      padding: 0 20px;
    }

    .content-card {
      background-color: white;
      border-radius: 24px;
      padding: 40px;
      box-shadow: 0 10px 30px rgba(255, 150, 200, 0.3);
    }

    .content-card h2 {
      color: #ff69b4;
      font-size: 2em;
      margin-bottom: 30px;
      text-align: center;
    }

    .education-section {
      margin-bottom: 30px;
    }

    .education-item {
      background-color: #fff0f5;
      border-radius: 16px;
      padding: 20px 25px;
      margin-bottom: 15px;
      border-left: 4px solid #ff69b4;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .education-item:hover {
      transform: translateX(5px);
      box-shadow: 0 4px 15px rgba(255, 150, 200, 0.2);
    }

    .education-date {
      color: #ff69b4;
      font-weight: bold;
      font-size: 0.95em;
      margin-bottom: 5px;
    }

    .education-school {
      color: #5a5a5a;
      font-size: 1.1em;
      font-weight: bold;
    }

    .education-major {
      color: #888;
      font-size: 1em;
      margin-top: 3px;
    }

    .section-title {
      color: #ff69b4;
      font-size: 1.3em;
      font-weight: bold;
      margin: 25px 0 15px 0;
      padding-bottom: 8px;
      border-bottom: 2px solid #ffe6f2;
    }

    .course-list {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 10px;
    }

    .course-tag {
      background-color: #e6f7ff;
      color: #5a5a5a;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.9em;
      border: 1px solid #cceeff;
    }

    .summer-program {
      background-color: #fff9f0;
      border-radius: 16px;
      padding: 20px 25px;
      border-left: 4px solid #ffb347;
    }

    .summer-program .education-date {
      color: #ffb347;
    }

    .footer {
      margin-top: 50px;
      font-size: 0.9em;
      color: #aaa;
      text-align: center;
    }
  </style>
</head>
<body>
  <nav class="navbar">
    <div class="nav-container">
      <a href="index.html" class="logo">✨lrj的小天地✨</a>
      <div class="nav-links">
        <a href="education.html">教育背景</a>
        <a href="internship.html">实习经历</a>
        <a href="projects.html">项目经历</a>
      </div>
    </div>
  </nav>

  <div class="content-page">
    <div class="content-card">
      <h2>教育背景</h2>
      
      <div class="education-section">
        <div class="education-item">
          <div class="education-date">2020.09 - 2021.08</div>
          <div class="education-school">上海交通大学</div>
          <div class="education-major">广播电视编导</div>
        </div>
        
        <div class="education-item">
          <div class="education-date">2021.09 - 2025.06</div>
          <div class="education-school">上海交通大学</div>
          <div class="education-major">传播学 - 本科</div>
        </div>
        
        <div class="education-item">
          <div class="education-date">2025.09 - 至今</div>
          <div class="education-school">上海交通大学</div>
          <div class="education-major">传播学 - 学硕</div>
        </div>
      </div>

      <div class="section-title">选修课程</div>
      <div class="course-list">
        <span class="course-tag">人机传播</span>
        <span class="course-tag">AIGC与新媒体实务</span>
        <span class="course-tag">计算社会科学</span>
        <span class="course-tag">人工智能基础与实践</span>
        <span class="course-tag">市场调研</span>
        <span class="course-tag">定量传播研究</span>
      </div>

      <div class="section-title">暑期访学项目</div>
      <div class="summer-program">
        <div class="education-date">2024.7</div>
        <div class="education-school">新加坡国立大学</div>
      </div>

      <div class="footer">
        🌸 制作于 2026 春 ✨
      </div>
    </div>
  </div>
</body>
</html>
