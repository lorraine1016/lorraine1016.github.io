<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>实习经历 | ✨lrj的小天地✨</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: linear-gradient(135deg, #ffe6f2, #e6f7ff);
      font-family: 'Comic Sans MS', cursive, sans-serif;
      color: #5a5a5a;
      min-height: 100vh;
    }

    .navbar {
      background-color: white;
      box-shadow: 0 4px 12px rgba(255, 150, 200, 0.2);
      padding: 15px 0;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 1000;
    }

    .nav-container {
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 20px;
    }

    .logo {
      color: #ff69b4;
      font-size: 1.5em;
      font-weight: bold;
      text-decoration: none;
    }

    .nav-links {
      display: flex;
      gap: 30px;
    }

    .nav-links a {
      color: #5a5a5a;
      text-decoration: none;
      font-weight: bold;
      padding: 8px 16px;
      border-radius: 20px;
      transition: all 0.3s ease;
    }

    .nav-links a:hover {
      background-color: #fff0f5;
      color: #ff69b4;
      transform: translateY(-2px);
    }

    .content-page {
      max-width: 1200px;
      margin: 120px auto 50px;
      padding: 0 20px;
    }

    .content-card {
      background-color: white;
      border-radius: 24px;
      padding: 40px;
      box-shadow: 0 10px 30px rgba(255, 150, 200, 0.3);
    }

    .content-card h2 {
      color: #ff69b4;
      font-size: 2em;
      margin-bottom: 30px;
      text-align: center;
    }

    .career-goal {
      background: linear-gradient(135deg, #ffe6f2, #f0f8ff);
      border-radius: 16px;
      padding: 25px;
      margin-bottom: 30px;
      text-align: center;
      border: 2px solid #ffd6e8;
    }

    .career-goal h3 {
      color: #ff69b4;
      font-size: 1.3em;
      margin-bottom: 10px;
    }

    .career-goal p {
      font-size: 1.1em;
      color: #5a5a5a;
      margin: 0;
    }

    .internship-section {
      margin-top: 30px;
    }

    .internship-item {
      background-color: #f0f8ff;
      border-radius: 16px;
      padding: 20px 25px;
      margin-bottom: 15px;
      border-left: 4px solid #69b4ff;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .internship-item:hover {
      transform: translateX(5px);
      box-shadow: 0 4px 15px rgba(105, 180, 255, 0.2);
    }

    .internship-date {
      color: #69b4ff;
      font-weight: bold;
      font-size: 0.95em;
      margin-bottom: 5px;
    }

    .internship-company {
      color: #5a5a5a;
      font-size: 1.1em;
      font-weight: bold;
    }

    .internship-position {
      color: #888;
      font-size: 1em;
      margin-top: 3px;
    }

    .footer {
      margin-top: 50px;
      font-size: 0.9em;
      color: #aaa;
      text-align: center;
    }
  </style>
</head>
<body>
  <nav class="navbar">
    <div class="nav-container">
      <a href="index.html" class="logo">✨lrj的小天地✨</a>
      <div class="nav-links">
        <a href="education.html">教育背景</a>
        <a href="internship.html">实习经历</a>
        <a href="projects.html">项目经历</a>
      </div>
    </div>
  </nav>

  <div class="content-page">
    <div class="content-card">
      <h2>实习经历</h2>
      
      <div class="career-goal">
        <h3>职业目标</h3>
        <p>让有意义的事物，在更大的世界里，抵达需要它的角落</p>
      </div>

      <div class="internship-section">
        <div class="internship-item">
          <div class="internship-date">2025.03 - 2025.06</div>
          <div class="internship-company">心芯相栖</div>
          <div class="internship-position">产品增长实习生</div>
        </div>
        
        <div class="internship-item">
          <div class="internship-date">2024.08 - 2024.12</div>
          <div class="internship-company">携程集团</div>
          <div class="internship-position">国际公关实习生</div>
        </div>
        
        <div class="internship-item">
          <div class="internship-date">2022.10 - 2023.02</div>
          <div class="internship-company">FGS Global</div>
          <div class="internship-position">战略传播实习生</div>
        </div>
        
        <div class="internship-item">
          <div class="internship-date">2022.04 - 2022.09</div>
          <div class="internship-company">上海广播电视台</div>
          <div class="internship-position">营销传播实习生</div>
        </div>
      </div>

      <div class="footer">
        🌸 制作于 2026 春 ✨
      </div>
    </div>
  </div>
</body>
</html>
